# Supply Chain Security — hard gate.
#
# Blocks at merge time:
#   1. Leaked secrets (gitleaks scans the FULL git history on push, the PR diff on PRs).
#   2. Malicious / discontinued packages (OSV database "MAL" entries in the lockfile).
#   3. NEW dependencies with known vulnerabilities (PR-only OSV diff: the
#      merge-target branch's lockfile is re-scanned and any advisory that did
#      not exist there is a hard fail — no Dependency graph needed).
#   4. Code-level security issues incl. supply-chain-style injection (CodeQL,
#      security-extended + security-malicious-code query packs).
#
# Known advisory debt in the legacy lockfile (historical vulnerabilities that
# pre-date this gate) keeps filing dependabot alerts and remains intentionally
# report-only until the dependency-upgrade sprint lands. Do NOT weaken the
# gitleaks or OSV-MAL jobs to make a scan green: those findings are always blockers.

name: Supply Chain Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly rescan of main — catches newly published malware in pinned installs.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs the pinned gitleaks CLI directly (the gitleaks-action wrapper
      # currently hard-requires a commercial GITLEAKS_LICENSE for org
      # accounts). Reads the repo-root .gitleaks.toml. Non-zero exit on leaks.
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /src --redact

  malware-deps:
    name: osv-malware-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan lockfile for malicious packages (OSV database)
        run: |
          LOCK=pnpm-lock.yaml

          scan() {
            docker run --rm -v "$1:/src" -w /src \
              ghcr.io/google/osv-scanner:v2.7.0 \
              scan source --format json -L "$2" > "$3" || true
          }

          scan "$PWD" "$LOCK" "${RUNNER_TEMP}/head.json"
          MAL=$(jq '[.results[]?.packages[]?.vulnerabilities[]? | select(.id | startswith("MAL"))] | length' "${RUNNER_TEMP}/head.json")
          ADV=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' "${RUNNER_TEMP}/head.json")
          {
            echo "### OSV scan ($LOCK, PR head)"
            echo "- known advisories on root: ${ADV}"
            echo "- malicious/discontinued packages: ${MAL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MAL" -gt 0 ]; then
            echo "::error::Malicious package(s) detected in $LOCK:"
            jq -r '.results[]?.packages[]?.vulnerabilities[]? | select(.id | startswith("MAL")) | "- \(.id): \(.summary // "no summary")"' \
              "${RUNNER_TEMP}/head.json" || true
            exit 1
          fi

          # PR diff gate (no dependency graph needed): re-scan the BASE branch
          # lockfile and fail on ANY advisory that is new relative to it —
          # malware, or a newly introduced vulnerable dependency.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mkdir -p "${RUNNER_TEMP}/base"
            git show "origin/${{ github.event.pull_request.base.ref }}:$LOCK" \
              > "${RUNNER_TEMP}/base/$LOCK"
            scan "${RUNNER_TEMP}/base" "$LOCK" "${RUNNER_TEMP}/base.json"

            jq -r '[.results[]?.packages[]?.vulnerabilities[]?.id] | unique | .[]' \
              "${RUNNER_TEMP}/head.json" | sort > "${RUNNER_TEMP}/head.ids"
            jq -r '[.results[]?.packages[]?.vulnerabilities[]?.id] | unique | .[]' \
              "${RUNNER_TEMP}/base.json" | sort > "${RUNNER_TEMP}/base.ids"

            NEW_IDS=$(comm -23 "${RUNNER_TEMP}/head.ids" "${RUNNER_TEMP}/base.ids")
            if [ -n "$NEW_IDS" ]; then
              echo "### OSV diff vs base (NEW advisories introduced by this PR)" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::This PR introduces new vulnerability advisories (blocked):"
              for id in $NEW_IDS; do
                echo "- $id" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::  $id"
              done
              exit 1
            fi
            echo "### OSV diff vs base: no new advisories introduced by this PR" >> "$GITHUB_STEP_SUMMARY"
          fi

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # `security-extended` is a recognized suite alias. Raw pack names like
          # `security-malicious-code` fail pack resolution in current action
          # versions ("Query pack ... cannot be found").
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
